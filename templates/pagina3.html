<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teclado Digital</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='pagina3.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='sugestoes.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Secular+One&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app" id="app">

        <!-- BARRA SUPERIOR -->
        <div class="barra-superior">

            <a href="{{ url_for('index') }}" class="botao-superior botao-superior-1">
                <img src="{{ url_for('static', filename='imagens/casinha.png') }}" alt="Início">
            </a>

            <div class="texto-digitado" id="texto-digitado">
                <div class="texto-linhas"><span id="conteudo-texto"></span><span class="cursor-texto">|</span></div>
            </div>

            <div class="botao-superior botao-superior-2" onclick="fecharPrograma()">
                <img src="{{ url_for('static', filename='imagens/x saida.png') }}" alt="Fechar">
            </div>


        </div>


        <!-- ÁREA DOS 3 BOTÕES -->
        <div class="area-botoes-superiores"></div>

        <div class="botao-categoria botao-categoria-1" id="sugestao-1" onclick="aceitarSugestao(0)"></div>
        <div class="botao-categoria botao-categoria-2" id="sugestao-2" onclick="aceitarSugestao(1)"></div>
        <div class="botao-categoria botao-categoria-3" id="sugestao-3" onclick="aceitarSugestao(2)"></div>


        <!-- PRIMEIRA FILEIRA -->
        <div class="botao-principal botao-principal-1" onclick="digitarEVoltar('G')">
            <span class="texto-botao">G</span>
        </div>
        <div class="botao-principal botao-principal-2" onclick="digitarEVoltar('H')">
            <span class="texto-botao">H</span>
        </div>
        <div class="botao-principal botao-principal-3" onclick="digitarEVoltar('I')">
            <span class="texto-botao">I</span>
        </div>


        <!-- SEGUNDA FILEIRA -->
        <div class="botao-principal botao-principal-4" onclick="digitarEVoltar('J')">
            <span class="texto-botao">J</span>
        </div>
        <div class="botao-principal botao-principal-5" onclick="digitarEVoltar('K')">
            <span class="texto-botao">K</span>
        </div>
        <div class="botao-principal botao-principal-6" onclick="digitarEVoltar('L')">
            <span class="texto-botao">L</span>
        </div>

    </div>

    <script src="{{ url_for('static', filename='escala.js') }}"></script>
    <script src="{{ url_for('static', filename='sugestoes.js') }}"></script>

</body>

</html>
